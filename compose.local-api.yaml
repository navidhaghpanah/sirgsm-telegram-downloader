services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${API_ID:?Set API_ID in .env}
      TELEGRAM_API_HASH: ${API_HASH:?Set API_HASH in .env}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "8081"
    volumes:
      - telegram_bot_api:/var/lib/telegram-bot-api

  bot:
    depends_on:
      - telegram-bot-api
    environment:
      TELEGRAM_API_ROOT: http://telegram-bot-api:8081
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-1900}

volumes:
  telegram_bot_api:
